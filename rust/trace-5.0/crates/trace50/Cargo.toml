[package]
name = "trace50"
version = "5.0.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "High-performance algorithmic kernel + CLI for TRACE-5.0: Dynamic Molecular Surveillance of Viral Transmission Networks"
license = "MIT"
repository = "https://github.com/veg/HyphAeon"
homepage = "https://github.com/veg/HyphAeon"

[dependencies]
aeon-manifold.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
parallel = ["dep:rayon"]

[[bin]]
name = "trace50"
path = "src/bin/trace50.rs"
required-features = ["cli"]

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["cli"]
