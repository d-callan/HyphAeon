[package]
name = "trace50-cli"
version = "5.0.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "Native standalone CLI executable for TRACE-5.0"

[dependencies]
trace50-core = { path = "../trace50-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "trace50"
path = "src/main.rs"
