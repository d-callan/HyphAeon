[package]
name = "trace50-wasm"
version = "5.0.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "WebAssembly client-side engine for TRACE-5.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trace50-core = { path = "../trace50-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]
