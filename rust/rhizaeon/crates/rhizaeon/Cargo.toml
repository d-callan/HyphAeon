[package]
name = "rhizaeon"
version = "0.1.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "High-performance, zero-dependency algorithmic kernel + CLI for RhizAeon PA-FF (v2.1)"
license = "MIT"
repository = "https://github.com/veg/HyphAeon"
homepage = "https://github.com/veg/HyphAeon"

[dependencies]
aeon-manifold.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rayon"]

[[bin]]
name = "rhizaeon"
path = "src/bin/rhizaeon.rs"
required-features = ["cli"]

[[bin]]
name = "export_figure1_data"
path = "src/bin/export_figure1_data.rs"
required-features = ["cli"]

[dev-dependencies]
