[package]
name = "rhizaeon-cli"
version = "0.1.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "Native standalone CLI executable for RhizAeon PA-FF (v2.1)"

[dependencies]
rhizaeon-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

[[bin]]
name = "rhizaeon"
path = "src/main.rs"

[[bin]]
name = "export_figure1_data"
path = "src/bin/export_figure1_data.rs"

