[workspace]
members = [
    "libs/aeon-autoclock",
    "libs/aeon-manifold",
    "../aeon-core/native",
    "rhizaeon/crates/rhizaeon",
    "rhizaeon/crates/rhizaeon-wasm",
    "trace-5.0/crates/trace50",
    "trace-5.0/crates/trace50-wasm",
]
resolver = "2"

[workspace.dependencies]
aeon-autoclock = { path = "libs/aeon-autoclock", version = "0.1.0" }
aeon-manifold = { path = "libs/aeon-manifold", version = "0.1.0" }
rhizaeon = { path = "rhizaeon/crates/rhizaeon", version = "0.1.0", default-features = false }
trace50 = { path = "trace-5.0/crates/trace50", version = "5.0.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
pyo3 = { version = "0.23", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
