[workspace]
members = [
    "libs/aeon-manifold",
    "libs/aeon-py",
    "rhizaeon/crates/rhizaeon-core",
    "rhizaeon/crates/rhizaeon-cli",
    "rhizaeon/crates/rhizaeon-wasm",
    "trace-5.0/crates/trace50-core",
    "trace-5.0/crates/trace50-cli",
    "trace-5.0/crates/trace50-wasm",
]
resolver = "2"

[workspace.dependencies]
aeon-manifold = { path = "libs/aeon-manifold", version = "0.1.0" }
rhizaeon-core = { path = "rhizaeon/crates/rhizaeon-core", version = "0.1.0" }
trace50-core = { path = "trace-5.0/crates/trace50-core", version = "5.0.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
pyo3 = { version = "0.23", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
