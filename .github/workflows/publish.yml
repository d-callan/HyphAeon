name: publish

on:
  push:
    tags:
      - "hyphaeon-core-v*"
      - "hyphaeon-v*"
      - "chronaeon-v*"
      - "rhizaeon-v*"
      - "trace50-v*"

permissions:
  contents: read
  id-token: write  # mints the OIDC token gh-action-pypi-publish exchanges with PyPI

jobs:
  verify:
    name: Resolve tag -> package dir, assert version match
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
      tag_version: ${{ steps.pkg.outputs.tag_version }}
      native: ${{ steps.pkg.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Determine package from tag
        id: pkg
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          NATIVE=false
          if [[ "$TAG" == hyphaeon-core-v* ]]; then
            DIR=aeon-core
            NATIVE=true
          elif [[ "$TAG" == rhizaeon-v* ]]; then
            DIR=rhizaeon
            NATIVE=true
          elif [[ "$TAG" == trace50-v* ]]; then
            DIR=trace50
            NATIVE=true
          elif [[ "$TAG" == hyphaeon-v* ]]; then
            DIR=hyphaeon
          elif [[ "$TAG" == chronaeon-v* ]]; then
            DIR=chronaeon
          else
            echo "::error::Unrecognized tag '$TAG'"; exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "tag_version=${TAG##*-v}" >> $GITHUB_OUTPUT
          echo "native=$NATIVE" >> $GITHUB_OUTPUT
      - name: Verify tag matches package version
        run: |
          # Static pyproject projects carry [project].version; maturin
          # packages (rhizaeon, trace50) declare dynamic version and the
          # canonical string lives in native/Cargo.toml.
          PKG_VERSION=$(python - "${{ steps.pkg.outputs.dir }}" <<'PY'
          import sys, tomllib
          d = sys.argv[1]
          v = tomllib.load(open(f"{d}/pyproject.toml", "rb"))["project"].get("version")
          if v is None:
              v = tomllib.load(open(f"{d}/native/Cargo.toml", "rb"))["package"]["version"]
          print(v)
          PY
          )
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.tag_version }}" ]; then
            echo "::error::Tag version '${{ steps.pkg.outputs.tag_version }}' does not match package version '$PKG_VERSION'"
            exit 1
          fi

  # hyphaeon-core, rhizaeon, and trace50 ship compiled extensions: one abi3
  # wheel per platform covers all Python >= 3.8. Windows included per
  # AEON-UNIFICATION-PLAN C4 (pure-Python installs today work on Windows;
  # dropping the leg would regress pip install there).
  wheels:
    name: abi3 wheel (${{ matrix.platform }})
    needs: verify
    if: needs.verify.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ needs.verify.outputs.dir }}
          args: --release --out dist
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          python -m pip install "${{ needs.verify.outputs.dir }}"/dist/*.whl
          cd "$RUNNER_TEMP"  # exercise the installed wheel, not the source tree
          if [ "${{ needs.verify.outputs.dir }}" = "aeon-core" ]; then
            # aeon-core ships no console script; importing the extension
            # is the smoke check.
            python -c "import aeon_core._native"
          else
            # Console-script name matches the package dir for rhizaeon
            # and trace50; --version exits 0 without touching data files.
            ${{ needs.verify.outputs.dir }} --version
          fi
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: ${{ needs.verify.outputs.dir }}/dist/

  # No sdist job: the binding manifests live outside the rust workspace
  # root (rhizaeon/native, trace50/native, aeon-core/native), so
  # `maturin sdist` cannot strip the workspace prefix and workspace path
  # deps can't be vendored anyway. The abi3 wheel matrix covers all
  # tier-1 platforms; other users build from the repo with maturin.

  publish-native:
    name: "twine check + PyPI upload (native: ${{ needs.verify.outputs.dir }})"
    needs: [verify, wheels]
    if: needs.verify.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: ${{ needs.verify.outputs.dir }}/dist
          merge-multiple: true
      - name: twine check
        run: |
          pip install twine
          ls -la ${{ needs.verify.outputs.dir }}/dist
          twine check ${{ needs.verify.outputs.dir }}/dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.verify.outputs.dir }}/dist
        # Publishes via OIDC trusted publishing — no PYPI_API_TOKEN secret.
        # rhizaeon/trace50 need trusted publishers registered for this repo +
        # workflow filename on their PyPI projects before first release.

  publish-pure:
    name: build + PyPI upload (hyphaeon / chronaeon)
    needs: verify
    if: needs.verify.outputs.native == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and check distribution
        run: |
          pip install build twine
          cd ${{ needs.verify.outputs.dir }}
          python -m build
          twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          # CPU torch keeps dep resolution small; the wheel's declared
          # floors (incl. hyphaeon-core) are still resolved from PyPI, so
          # this also catches a bad dependency pin before upload.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ needs.verify.outputs.dir }}"/dist/*.whl
          cd "$(mktemp -d)"  # exercise the installed wheel, not the source tree
          ${{ needs.verify.outputs.dir }} --version
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.verify.outputs.dir }}/dist
        # Publishes via OIDC trusted publishing — no PYPI_API_TOKEN secret.
        # Requires a trusted publisher registered on each PyPI project for
        # this repo + workflow filename (done 2026-10-07).
