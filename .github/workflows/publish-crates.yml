name: publish-crates

# Tag-driven crates.io publishing. Release order matters: rhizaeon and
# trace50 have versioned deps on aeon-manifold, so the shared crate must
# be on the registry first. Push aeon-manifold-v* first, wait for this
# workflow to go green, then push rhizaeon-v* / trace50-v*. The product
# jobs poll `cargo search` and fail fast after a timeout rather than
# silently succeeding — if they time out, publish the shared crate tag
# and re-run.
#
# Requires secret CARGO_REGISTRY_TOKEN (crates.io API token, publish scope
# for all listed crates). crates.io OIDC trusted publishing is the
# token-free alternative if configured on the registry side later.
on:
  push:
    tags:
      - "aeon-manifold-v*"
      - "rhizaeon-v*"
      - "trace50-v*"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: aeon-manifold
            tag_prefix: aeon-manifold-v
            toml: rust/libs/aeon-manifold/Cargo.toml
            wait_for: ""
          - crate: rhizaeon
            tag_prefix: rhizaeon-v
            toml: rust/rhizaeon/crates/rhizaeon/Cargo.toml
            wait_for: aeon-manifold
          - crate: trace50
            tag_prefix: trace50-v
            toml: rust/trace-5.0/crates/trace50/Cargo.toml
            wait_for: aeon-manifold
    # Each matrix leg fires on every tag push; only the leg matching the
    # pushed tag does any work.
    if: startsWith(github.ref, format('refs/tags/{0}', matrix.tag_prefix))
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches crate version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG##*-v}
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('${{ matrix.toml }}','rb'))['package']['version'])")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' != Cargo.toml version '$PKG_VERSION' for ${{ matrix.crate }}"
            exit 1
          fi
      - name: Wait for shared deps on crates.io
        if: matrix.wait_for != ''
        working-directory: rust
        run: |
          # Version required by workspace.dependencies for ${{ matrix.wait_for }}.
          REQ=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['dependencies']['${{ matrix.wait_for }}']['version'])")
          echo "Waiting for ${{ matrix.wait_for }} $REQ on crates.io..."
          for i in $(seq 1 60); do
            if cargo search "${{ matrix.wait_for }}" --limit 1 2>/dev/null | grep -q "\"$REQ\""; then
              echo "${{ matrix.wait_for }} $REQ is live"; exit 0
            fi
            sleep 10
          done
          echo "::error::${{ matrix.wait_for }} $REQ not on crates.io after 10 min — push its tag first"
          exit 1
      - name: cargo publish --dry-run
        working-directory: rust
        run: cargo publish -p ${{ matrix.crate }} --dry-run --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: cargo publish
        working-directory: rust
        run: cargo publish -p ${{ matrix.crate }} --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
