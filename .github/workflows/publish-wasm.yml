name: publish-wasm

# Tag-driven WASM artifact publishing, fired by the SAME product tags
# as publish.yml (PyPI): rhizaeon-v* and trace50-v*. One tag = one
# product version = wheel on PyPI + wasm-pack bundle on the GitHub
# Release.
#
# veg/rhizaeon-code and veg/trace-5.0 serve GitHub Pages apps that load a
# wasm-pack bundle from ./pkg/. Rather than each repo building (and
# vendoring) its own copy, they pull the bundle attached to the matching
# release tag in THIS repository, e.g.:
#
#   gh release download --repo veg/HyphAeon rhizaeon-v0.1.0 \
#     --pattern 'rhizaeon-wasm-*-pkg.tar.gz' --output - | tar -xz -C docs/pkg
#
# crates.io is deliberately NOT a channel: the consumers need files, not
# cargo dependencies.
#
# The wasm crate version must equal the product tag version (pyproject,
# native crate, and wasm crate are versioned in lockstep), and the job
# smoke-tests the fresh bundle with node before publishing — so a tagged
# release can never ship a stale or broken pkg.
on:
  push:
    tags:
      - "rhizaeon-v*"
      - "trace50-v*"

permissions:
  contents: write  # gh release create --repo needs write on the tag's repo

jobs:
  publish:
    name: wasm release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve tag -> package and assert version match
        id: pkg
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG##*-v}
          case "$TAG" in
            rhizaeon-v*) PKG=rhizaeon-wasm; CRATE_DIR=rust/rhizaeon/crates/rhizaeon-wasm ;;
            trace50-v*)  PKG=trace50-wasm;  CRATE_DIR=rust/trace-5.0/crates/trace50-wasm ;;
            *) echo "::error::Unrecognized tag '$TAG'"; exit 1 ;;
          esac
          PKG_VERSION=$(grep -m1 '^version' "$CRATE_DIR/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' != wasm crate version '$PKG_VERSION' for $PKG (versions are lockstep across pyproject/native/wasm)"
            exit 1
          fi
          {
            echo "pkg=$PKG"
            echo "crate_dir=$CRATE_DIR"
            echo "tag_version=$TAG_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Build wasm bundle (fresh, not the committed pkg)
        run: wasm-pack build --target web --release "${{ steps.pkg.outputs.crate_dir }}"
      - name: Smoke-test fresh bundle
        working-directory: ${{ steps.pkg.outputs.crate_dir }}
        run: node test_wasm.mjs
      - name: Package pkg/ as tarball
        run: |
          ASSET="${{ steps.pkg.outputs.pkg }}-${{ steps.pkg.outputs.tag_version }}-pkg.tar.gz"
          tar -czf "$ASSET" -C "${{ steps.pkg.outputs.crate_dir }}/pkg" .
          echo "asset=$ASSET" >> $GITHUB_ENV
      - name: Publish GitHub Release with pkg bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION=${TAG##*-v}
          cat > /tmp/release-notes.md <<EOF
          wasm-pack bundle (\`--target web\`) for **${{ steps.pkg.outputs.pkg }} ${TAG_VERSION}**,
          built fresh from tag \`${TAG}\` (same tag as the PyPI release).

          Consumers (e.g. the GitHub Pages apps in veg/rhizaeon-code,
          veg/trace-5.0) fetch this exact version into \`docs/pkg/\`:

          \`\`\`sh
          gh release download --repo ${{ github.repository }} ${TAG} \\
            --pattern '${{ steps.pkg.outputs.pkg }}-*-pkg.tar.gz' --output - | tar -xz -C docs/pkg
          \`\`\`

          The bundle is verified by the crate's \`test_wasm.mjs\` smoke test
          before this release is created.
          EOF
          # Idempotent: create the release if missing, then (re)upload the
          # asset so a re-run of this job doesn't fail on a pre-existing release.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "${{ steps.pkg.outputs.pkg }} ${TAG_VERSION} wasm bundle" \
              --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" "$ASSET" --clobber --repo "${{ github.repository }}"
