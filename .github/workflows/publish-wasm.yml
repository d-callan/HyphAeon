name: publish-wasm

# Tag-driven WASM artifact publishing, fired by the SAME product tags
# as publish.yml (PyPI): rhizaeon-v* and trace50-v*. One tag = one
# product version = wheel on PyPI + wasm-pack bundle on the GitHub
# Release.
#
# veg/rhizaeon-code and veg/trace-5.0 serve GitHub Pages apps that load a
# wasm-pack bundle from ./pkg/. Rather than each repo building (and
# vendoring) its own copy, they pull the bundle attached to the matching
# release tag in THIS repository, e.g.:
#
#   gh release download --repo veg/HyphAeon rhizaeon-v0.1.0 \
#     --pattern 'rhizaeon-wasm-*-pkg.tar.gz' --output - | tar -xz -C docs/pkg
#
# crates.io is deliberately NOT a channel: the consumers need files, not
# cargo dependencies.
#
# The wasm crate version must equal the product tag version (pyproject,
# native crate, and wasm crate are versioned in lockstep), and the job
# smoke-tests the fresh bundle with node before publishing — so a tagged
# release can never ship a stale or broken pkg.
on:
  push:
    tags:
      - "rhizaeon-v*"
      - "trace50-v*"

permissions:
  contents: write  # gh release create --repo needs write on the tag's repo

jobs:
  publish:
    name: wasm release ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: rhizaeon-wasm
            tag_prefix: rhizaeon-v
            crate_dir: rust/rhizaeon/crates/rhizaeon-wasm
          - pkg: trace50-wasm
            tag_prefix: trace50-v
            crate_dir: rust/trace-5.0/crates/trace50-wasm
    # Each matrix leg fires on every tag push; only the leg matching the
    # pushed tag does any work.
    if: startsWith(github.ref, format('refs/tags/{0}', matrix.tag_prefix))
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Resolve tag and assert version match
        id: pkg
        env:
          CRATE_DIR: ${{ matrix.crate_dir }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG##*-v}
          PKG_VERSION=$(grep -m1 '^version' "$CRATE_DIR/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' != wasm crate version '$PKG_VERSION' for ${{ matrix.pkg }} (versions are lockstep across pyproject/native/wasm)"
            exit 1
          fi
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
      - name: Build wasm bundle (fresh, not the committed pkg)
        run: wasm-pack build --target web --release "${{ matrix.crate_dir }}"
      - name: Smoke-test fresh bundle
        working-directory: ${{ matrix.crate_dir }}
        run: node test_wasm.mjs
      - name: Package pkg/ as tarball
        run: |
          ASSET="${{ matrix.pkg }}-${{ steps.pkg.outputs.tag_version }}-pkg.tar.gz"
          tar -czf "$ASSET" -C "${{ matrix.crate_dir }}/pkg" .
          echo "asset=$ASSET" >> $GITHUB_ENV
      - name: Publish GitHub Release with pkg bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION=${TAG##*-v}
          cat > /tmp/release-notes.md <<EOF
          wasm-pack bundle (\`--target web\`) for **${{ matrix.pkg }} ${TAG_VERSION}**,
          built fresh from tag \`${TAG}\` (same tag as the PyPI release).

          Consumers (e.g. the GitHub Pages apps in veg/rhizaeon-code,
          veg/trace-5.0) fetch this exact version into \`docs/pkg/\`:

          \`\`\`sh
          gh release download --repo ${{ github.repository }} ${TAG} \\
            --pattern '${{ matrix.pkg }}-*-pkg.tar.gz' --output - | tar -xz -C docs/pkg
          \`\`\`

          The bundle is verified by the crate's \`test_wasm.mjs\` smoke test
          before this release is created.
          EOF
          gh release create "$TAG" "$ASSET" \
            --repo "${{ github.repository }}" \
            --title "${{ matrix.pkg }} ${TAG_VERSION} wasm bundle" \
            --notes-file /tmp/release-notes.md
