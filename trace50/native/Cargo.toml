[package]
name = "trace50-native"
version = "5.0.0-beta.1"
edition = "2021"
publish = false
workspace = "../../rust"

[lib]
name = "trace50_native"
# rlib lets integration tests exercise cli_main in-process; the cdylib
# remains the Python extension artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
trace50 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py38"] }
