[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axomeme"
version = "1.0.0"
authors = [
  { name="Sergei L. Kosakovsky Pond", email="spond@temple.edu" },
]
description = "AxoMEME: Ultra-Fast Neural Inference of Episodic Positive Selection in Molecular Sequences"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0.0",
    "biopython>=1.80",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
axomeme = "axomeme.cli:main"

[tool.setuptools]
packages = ["axomeme"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
"Homepage" = "https://github.com/veg/axomeme"
"Bug Tracker" = "https://github.com/veg/axomeme/issues"
